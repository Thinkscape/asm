# nfpm config for the `asm` CLI (deb, rpm, apk, archlinux).
# Run from the repository root. Environment (set by the release workflow or `just packages`):
#   ASM_VERSION  version without the leading "v", e.g. 0.1.0
#   NFPM_ARCH    amd64 | arm64 (nfpm maps it per packager)
# The static musl `asm` binary for that arch must be at dist/nfpm/asm (nfpm does not expand
# environment variables in `contents`).
name: asm
arch: ${NFPM_ARCH}
platform: linux
version: ${ASM_VERSION}
version_schema: semver
release: 1
section: utils
priority: optional
maintainer: Artur Bodera <abodera@gmail.com>
vendor: Thinkscape
homepage: https://github.com/Thinkscape/asm
license: Apache-2.0
description: |-
  Agents Secrets Manager CLI.
  Lets coding agents request API keys and passwords from an operator's
  Agents Secrets Manager (macOS). The operator approves each request; the
  agent normally receives a sentinel that only the asm proxy turns into the
  real value, over HTTPS, for the approved hosts.

contents:
  - src: dist/nfpm/asm
    dst: /usr/bin/asm
    file_info:
      mode: 0755
  - src: README.md
    dst: /usr/share/doc/asm/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/asm/LICENSE
    file_info:
      mode: 0644
  - src: skill/asm/SKILL.md
    dst: /usr/share/asm/skill/asm/SKILL.md
    file_info:
      mode: 0644
  - src: skill/asm/SETUP.md
    dst: /usr/share/asm/skill/asm/SETUP.md
    file_info:
      mode: 0644
