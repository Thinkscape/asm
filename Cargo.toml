[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
asm-proto = { path = "crates/asm-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uniffi = "0.32.2"
axum = "0.8.9"
axum-server = { version = "0.9.2", features = ["tls-rustls-ring"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.46", default-features = false }
security-framework = "3.7.0"
tokio = { version = "1.54.1" }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.3"

[profile.release]
lto = "thin"
strip = true
